- id: 1
  descricao: |
    Criaturas comuns nas florestas do Overworld, os Treezards são o que
    há de melhor na natureza: graça, delicadeza e... falta de jeito.

- id: 2
  descricao: |
    Se você tiver a impressão de que o arbusto se mexeu, pode ter certeza
    que você encontrou um Green Bush! Estas coisas se espalham com uma
    rapidez impressionante nas florestas do Overworld.

- id: 3
  descricao: |
    Feras territorialistas do Netherworld, os Firesaurs acabam com qualquer um tolo o suficiente para desafiá-los. 
    /
    Fuja de suas garras incandescentes!

- id: 4
  descricao: |
    Imbuídos com magia vulcânica, os pequenos ídolos de Vadamagma 
    ganham vida para vaguear pelo Netherworld.

- id: 5
  descricao: |
    Rockillas vagam pelas planícies rochosas do Overworld em busca de
    alimento e abrigo.
    /
    Eles vivem segundo um código rídigo 
    que valoriza a lealdade acima de tudo; qualquer um que desafie isso é
    reduzido a pó por um golpe rápido de seus punhos gigantescos.

- id: 6
  descricao: |
    Criaturas de areia que vagam pelas dunas e praias do Overworld protegendo
    as ruínas de um antigo império.
    
- id: 7
  descricao: |
    O Portador das Tempestades, que 
    outrora foi um servo leal a Thorder
    e habitante do Aetherworld, foi expulso de sua ocupação após uma terrível traição, transformando-se
    no Pterathunder.
    /
    Essa criatura elétrica agora circula pelo Overworld, oferecendo a combinação perfeita de graça e
    perigo para aquele que julgar digno.
    
- id: 8
  descricao: |
    Rezam as lendas que Thorder, 
    quando está irado em Aetherworld, 
    golpeia o céu com tamanha força 
    que seres caóticos de eletricidade
    caem para o Overworld.

- id: 9
  descricao: |
    Tímida e discreta, essa astuta criatura é um oponente terrível
    nas águas do Overworld. 
    /
    Mersnakes podem ser lentos em terra firme, mas são tão perigosos quanto graciosos no oceano.

- id: 10
  descricao: |
    Criaturas ociosas dos rios e 
    lagos do Overworld. 
    /
    Elas vivem se exibindo em
    busca de atenção e cuidando 
    dos seus longos cabelos 
    água corrente.
    
- id: 11
  descricao: |
    Essas criaturas do Aetherworld dedicam a sua existência em proteger os
    filhotes obedientes a seus pais
    de todo e qualquer perigo até
    que atinjam a maturidade.

- id: 12
  descricao: |
    Imbuídos com magia celestial, os pequenos ídolos de Arch Knight são
    usados para guiar os forasteiros 
    em Aetherworld de volta para casa.
 
- id: 13
  descricao: |
    Estes pequenos seres prestativos ajudam comerciantes no Overworld
    a carregar seus itens, além de proteger contra feras hostis.

- id: 14
  descricao: |
    Após sair de Gardenia, sua cidade adotiva, esta fada viajou para a
    dimensão mágica do Overworld, com o intuito de estudar no colégio
    de fadas do reino de Magix.
    
- id: 15
  descricao: |
    Tremam diante do tirano emplumado!
    /
    Seus ataques atemorizam as mais diversas criaturas do Overworld, 
    tornando-o um oponente terrível, principalmente quando ataca em grupo.
    
- id: 16
  descricao: |
    As cavernas do Netherworld costumam ser um lugar silencioso, exceto
    quando um desaviado acorda um bando desta criatura! 
    
- id: 17
  descricao: |
    Habitantes dos Picos Rochosos do Overworld, estas criaturas feitas 
    de puro metal são difíceis de 
    derrubar por terem uma espessa
    camada de escamas.
    
- id: 18
  descricao: |
    Utilizados como para-raios em muitas cidades do Overworld, estas
    criaturas podem sempre surpreender 
    pela sua versatilidade.
    
- id: 19
  descricao: |
    Nas nuvens do Aetherworld, não é díficil encontrar uma destas criaturas
    descendo para o Overworld em busca de uma brisa tranquila nas florestas.

- id: 20
  descricao: |
    Nas florestas do Overworld, esta criatura protege seus filhotes do
    perigo com garras e bicadas.

- id: 21
  descricao: |
    Diferente de seus parentes 
    Green Bush, estes grandões usam 
    a força do seu peso para proteger 
    as florestas do Overworld.
    
- id: 22
  descricao: |
    Vapwhirl é um monstro errante do Overworld que viaja em busca de
    boas batalhas. Ele pode não ser 
    o mais forte, mas tem a capacidade 
    de virar o jogo a seu favor!
    
- id: 23
  descricao: |
    Tarzape leva uma vida sossegada nas 
    selvas do Overworld, repleta de 
    risadas e aventuras. Embora seja 
    bastante pacífico, ele se defenderá 
    ferozmente se estiver em perigo.

- id: 24
  descricao: |
    Helmantica foi destruída há muito tempo, mas os sonhos de Jack se 
    tornaram realidade. E das ruínas, do
    musgo e da magia, Molem ganhou vida. 
    /
    Agora, será difícil para qualquer
    um detê-lo.

- id: 25
  descricao: |
    Nascido nas profundezas de um grande vulcão do Netherworld, Firekong  
    possui uma estrutura corporal incrivelmente densa, o que lhe 
    confere uma resistência imensa. 
    /
    Seu amor pelo calor às vezes o leva 
    a se aproximar um pouco demais dos dragões!

- id: 26
  descricao: |
    Criatura solitária das Cavernas Profundas do Overworld, Omethyst demonstra uma resistência inigualável. 
    /
    Esse monstro adamantino é difícil de derrotar, mesmo para os mais
    poderosos.
    
- id: 27
  descricao: |
    Moradores das planícies rochosas do Overworld, os Obsidias são parentes 
    próximos dos Rockillas.
    /
    Duas vezes mais ferozes que seus irmãos, esses agentes do caos não 
    são gente com quem se brinque.
    
- id: 28
  descricao: |
    Uma famosa boxeadora polvo das Profundezas do Overworld. 
    /
    Ela é conhecida pelo seu jeito... 
    Levemente trapaceiro.
    
- id: 29
  descricao: |
    No Netherworld, Esmelters são responsáveis por derreter o
    metal nas grandes fornalhas.

- id: 30
  descricao: |
    Fayemelia trabalha em uma taverna na Baía Pirata e já não suporta mais
    ser paparicada todos os dias.
    /
    Por causa de sua fama, quando os homens pedem um pouco de sua
    atenção, eles costumam dizer:
    "Tudo fica melhor com ela
    por perto".
    /
    No entanto, tome cuidado com seu temperamento explosivo; se você a irritar, vai sentir na pele.